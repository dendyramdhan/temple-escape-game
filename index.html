<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temple Escape — Text Adventure RPG</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header>
      <h1>Temple Escape</h1>
      <p class="subtitle">A Text Adventure RPG</p>
    </header>

    <div id="status-bar">
      <div class="stat"><span class="label">HP</span> <span id="hp">100</span>/<span id="max-hp">100</span></div>
      <div class="stat"><span class="label">ATK</span> <span id="atk">10</span></div>
      <div class="stat"><span class="label">DEF</span> <span id="def">5</span></div>
      <div class="stat"><span class="label">Gold</span> <span id="gold">0</span></div>
    </div>

    <div id="game-area">
      <div id="location-title">Loading...</div>
      <div id="description"></div>
      <div id="message-log"></div>
      <div id="choices"></div>
    </div>

    <div id="inventory-panel">
      <h3>Inventory</h3>
      <ul id="inventory-list"></ul>
    </div>

    <div id="footer">
      <button id="btn-save" class="btn secondary">Save</button>
      <button id="btn-load" class="btn secondary">Load</button>
      <button id="btn-restart" class="btn secondary">Restart</button>
    </div>
  </div>

  <div id="modal" class="hidden">
    <div class="modal-content">
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <button id="modal-btn" class="btn">Continue</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
