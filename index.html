<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Temple Escape: Enhanced Edition</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-overlay"></div>
  <div id="flash"></div>
  <div id="damage-layer"></div>
  <div id="app">
    <header>
      <div class="title-glow">
        <h1>TEMPLE ESCAPE</h1>
        <p class="subtitle">ENHANCED EDITION</p>
      </div>
    </header>

    <div id="status-bar">
      <div class="stat-row">
        <div class="stat level-stat">
          <span class="label">LVL</span>
          <span id="level" class="value">1</span>
        </div>
        <div class="stat">
          <span class="label">ATK</span>
          <span id="atk" class="value">12</span>
        </div>
        <div class="stat">
          <span class="label">DEF</span>
          <span id="def" class="value">6</span>
        </div>
        <div class="stat gold-stat">
          <span class="label">GOLD</span>
          <span id="gold" class="value">0</span>
        </div>
      </div>

      <div class="bar-group">
        <div class="bar-label">
          <span>HP</span>
          <span><span id="hp">100</span> / <span id="max-hp">100</span></span>
        </div>
        <div class="bar-track hp-track">
          <div id="hp-bar" class="bar-fill hp-fill"></div>
        </div>
      </div>

      <div class="bar-group">
        <div class="bar-label">
          <span>EXP</span>
          <span><span id="exp">0</span> / <span id="exp-next">50</span></span>
        </div>
        <div class="bar-track exp-track">
          <div id="exp-bar" class="bar-fill exp-fill"></div>
        </div>
      </div>
    </div>

    <div class="main-row">
      <div id="game-area">
        <div id="location-title">Loading...</div>
        <div id="enemy-bar-wrap" class="hidden">
          <div class="bar-label"><span id="enemy-name">Enemy</span><span id="enemy-hp-text">0/0</span></div>
          <div class="bar-track enemy-track">
            <div id="enemy-hp-bar" class="bar-fill enemy-fill"></div>
          </div>
        </div>
        <div id="description"></div>
        <div id="message-log"></div>
        <div id="choices"></div>
      </div>

      <div id="side-panels">
        <div id="minimap-panel">
          <div class="minimap-title">MAP</div>
          <div id="minimap"></div>
        </div>
        <div id="journal-panel">
          <div class="minimap-title">JOURNAL</div>
          <div id="journal-list"></div>
        </div>
      </div>
    </div>

    <div id="inventory-panel">
      <h3>⚔ EQUIPMENT & INVENTORY</h3>
      <div id="equipment">
        <div class="eq-slot"><span class="eq-label">Weapon</span><span id="eq-weapon">None</span></div>
        <div class="eq-slot"><span class="eq-label">Armor</span><span id="eq-armor">None</span></div>
        <div class="eq-slot"><span class="eq-label">Accessory</span><span id="eq-accessory">None</span></div>
      </div>
      <ul id="inventory-list"></ul>
    </div>

    <div id="footer">
      <button id="btn-save" class="btn secondary">SAVE</button>
      <button id="btn-load" class="btn secondary">LOAD</button>
      <button id="btn-restart" class="btn secondary">RESTART</button>
      <button id="btn-mute" class="btn secondary">SOUND: ON</button>
    </div>
  </div>

  <div id="modal" class="hidden">
    <div class="modal-content">
      <div class="modal-glow"></div>
      <h2 id="modal-title"></h2>
      <div id="rank-badge" class="hidden"></div>
      <p id="modal-text"></p>
      <button id="modal-btn" class="btn primary">CONTINUE</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
